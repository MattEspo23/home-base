name: Validate Home Base

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: home-base-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Validate the full distributable tree
        run: node system/package.mjs --output /tmp/home-base-ci.tgz
