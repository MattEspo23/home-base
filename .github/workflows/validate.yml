name: Validate Home Base

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: home-base-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate the full distributable tree
        run: node system/package.mjs --output /tmp/home-base-ci.tgz
